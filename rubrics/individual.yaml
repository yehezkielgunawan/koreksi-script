schema_version: 2
rubric:
  id: individual
  feedback_language: id
  overall_feedback_below: 80
criteria:
  - id: understanding
    weight: 0.35
    description: Memahami dan menjawab pertanyaan secara tepat.
    required_evidence: Jawaban langsung yang menanggapi tuntutan pertanyaan.
    levels:
      - fraction: 0.0
        description: Tidak menjawab pertanyaan atau jawaban tidak relevan.
      - fraction: 0.5
        description: Menjawab sebagian dengan pemahaman yang masih terbatas.
      - fraction: 1.0
        description: Menjawab seluruh tuntutan dengan pemahaman yang akurat.
  - id: analysis
    weight: 0.30
    description: Menganalisis masalah dan menerapkan konsep yang relevan.
    required_evidence: Penalaran, hubungan sebab-akibat, atau penerapan pada kasus.
    levels:
      - fraction: 0.0
        description: Tidak ada analisis atau penerapan yang relevan.
      - fraction: 0.5
        description: Analisis atau penerapan ada tetapi masih dangkal.
      - fraction: 1.0
        description: Analisis mendalam dan penerapan spesifik terhadap konteks.
  - id: evidence
    weight: 0.25
    description: Mendukung klaim dengan bukti atau contoh yang sesuai.
    required_evidence: Contoh, kutipan, data, atau bukti visual yang relevan.
    levels:
      - fraction: 0.0
        description: Tidak ada bukti atau contoh pendukung.
      - fraction: 0.5
        description: Bukti tersedia tetapi terbatas atau kurang terhubung.
      - fraction: 1.0
        description: Bukti cukup, relevan, dan mendukung klaim utama.
  - id: clarity
    weight: 0.10
    description: Menyampaikan jawaban secara koheren dan lengkap.
    required_evidence: Struktur yang mudah diikuti dan kesimpulan yang beralasan.
    levels:
      - fraction: 0.0
        description: Jawaban tidak dapat dipahami atau tidak terstruktur.
      - fraction: 0.5
        description: Alur dasar dapat diikuti tetapi masih tidak konsisten.
      - fraction: 1.0
        description: Jawaban jelas, koheren, dan lengkap.
