schema_version: 2
rubric:
  id: group
  feedback_language: id
  overall_feedback_below: 80
criteria:
  - id: context
    weight: 0.25
    description: Menjelaskan konteks dan latar masalah secara spesifik.
    required_evidence: Kondisi awal, ruang lingkup, dan konteks masalah.
    levels:
      - fraction: 0.0
        description: Konteks tidak ada atau tidak relevan.
      - fraction: 0.5
        description: Konteks dasar ada tetapi masih umum atau tidak lengkap.
      - fraction: 1.0
        description: Konteks spesifik, lengkap, dan relevan.
  - id: problem
    weight: 0.25
    description: Merumuskan masalah dan menjelaskan urgensinya.
    required_evidence: Pernyataan masalah, dampak, dan alasan pembahasan.
    levels:
      - fraction: 0.0
        description: Masalah tidak dirumuskan.
      - fraction: 0.5
        description: Masalah dirumuskan tetapi urgensinya belum jelas.
      - fraction: 1.0
        description: Masalah dan urgensinya dirumuskan dengan meyakinkan.
  - id: evidence
    weight: 0.25
    description: Menggunakan sumber, data, atau contoh yang mendukung.
    required_evidence: Fakta, referensi, data, atau contoh yang dapat ditelusuri.
    levels:
      - fraction: 0.0
        description: Tidak ada bukti pendukung yang relevan.
      - fraction: 0.5
        description: Bukti ada tetapi terbatas atau kurang terhubung.
      - fraction: 1.0
        description: Bukti relevan dan cukup untuk mendukung klaim utama.
  - id: coherence
    weight: 0.25
    description: Menyusun alur argumentasi menuju tujuan paper.
    required_evidence: Transisi logis, hubungan antarparagraf, dan arah pembahasan.
    levels:
      - fraction: 0.0
        description: Argumentasi tidak koheren atau tidak memiliki arah.
      - fraction: 0.5
        description: Alur dapat diikuti tetapi masih memiliki lompatan logika.
      - fraction: 1.0
        description: Alur logis, konsisten, dan mengarah jelas pada tujuan paper.
