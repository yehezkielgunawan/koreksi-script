[project]
name = "koreksi-script"
version = "0.1.0"
description = "Auditable multimodal grading of student assignments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.82.0",
    "pdfplumber",
    "pydantic>=2.12.5",
    "pypdf",
    "pypdfium2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "pyyaml",
    "requests>=2.32.5",
    "tenacity",
]

[dependency-groups]
dev = [
    "pillow",
    "pytest",
    "reportlab",
]
